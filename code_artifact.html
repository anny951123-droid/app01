<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- 行動端優化：禁止縮放並支援滿版全螢幕安全區域 (Safe Area) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>極簡呼吸放鬆工具</title>
    <!-- 引入 Google Fonts Noto Sans TC 與 Inter 以獲得最佳閱讀質感 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 全域重置與行動端防反白設定 */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none; /* Safari / Chrome 禁止選取文字 */
            user-select: none;
            -webkit-touch-callout: none; /* 禁止 iOS 長按跳出選單 */
            -webkit-tap-highlight-color: transparent; /* 移除點擊時的預設高亮底色 */
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* 動態視窗高度，完美適應手機瀏覽器網址列 */
            background-color: #0f172a; /* 沉浸式深藍灰背景 */
            color: #f8fafc;
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden; /* 防止頁面上下滑動 */
        }

        /* 主容器：支援 iPhone 瀏海與底部橫條安全距離 */
        .app-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: calc(env(safe-area-inset-top) + 2rem) 1.5rem calc(env(safe-area-inset-bottom) + 3rem);
            position: relative;
        }

        /* 頂部極簡標題 */
        .header {
            text-align: center;
            opacity: 0.85;
        }

        .header h1 {
            font-size: 1.125rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #cbd5e1;
        }

        .header p {
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-top: 0.35rem;
        }

        /* 中央呼吸視覺區 */
        .breathing-stage {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 外層柔和漸層光暈 */
        .glow-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.28) 0%, rgba(129, 140, 248, 0.12) 55%, rgba(15, 23, 42, 0) 75%);
            transform: scale(0.55); /* 初始靜止縮小狀態 */
            opacity: 0.65;
            will-change: transform, opacity;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
        }

        /* 內層精緻發光圓環 */
        .core-ring {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(168, 85, 247, 0.22));
            border: 1.5px solid rgba(125, 211, 252, 0.45);
            box-shadow: 0 0 32px rgba(56, 189, 248, 0.2), inset 0 0 24px rgba(168, 85, 247, 0.15);
            transform: scale(0.55); /* 初始靜止縮小狀態 */
            will-change: transform;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 呼吸循環動畫：總長 8 秒 (4秒放大吸氣 + 4秒縮小呼氣) */
        .is-breathing .glow-ring {
            transition: none; /* 啟動動畫時交由 keyframes 控制 */
            animation: breatheGlow 8s ease-in-out infinite;
        }

        .is-breathing .core-ring {
            transition: none;
            animation: breatheCore 8s ease-in-out infinite;
        }

        @keyframes breatheCore {
            0%, 100% {
                transform: scale(0.55);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes breatheGlow {
            0%, 100% {
                transform: scale(0.55);
                opacity: 0.55;
            }
            50% {
                transform: scale(1.25);
                opacity: 1;
            }
        }

        /* 圓環中央動態指導文字 */
        .status-text {
            position: relative;
            z-index: 10;
            font-size: 1.35rem;
            font-weight: 300;
            letter-spacing: 0.18em;
            color: #f1f5f9;
            text-align: center;
            text-shadow: 0 2px 12px rgba(15, 23, 42, 0.8);
            transition: opacity 0.3s ease;
        }

        /* 底部控制按鈕 */
        .controls {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .action-btn {
            appearance: none;
            border: 1px solid rgba(56, 189, 248, 0.45);
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #38bdf8;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            padding: 1rem 3rem;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            /* 平滑的過渡與點擊縮放回饋 */
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        /* 手機點擊 :active 縮放回饋 */
        .action-btn:active {
            transform: scale(0.93);
        }

        /* 進行中狀態的按鈕樣式 */
        .action-btn.active {
            border-color: rgba(148, 163, 184, 0.4);
            background: rgba(30, 41, 59, 0.45);
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <main class="app-container" id="app">
        <!-- 頂部標題 -->
        <header class="header">
            <h1>靜心呼吸</h1>
            <p>4 秒吸氣 · 4 秒呼氣</p>
        </header>

        <!-- 中央光暈圓環與提示文字 -->
        <section class="breathing-stage" aria-live="polite">
            <div class="glow-ring"></div>
            <div class="core-ring"></div>
            <div class="status-text" id="statusText">準備</div>
        </section>

        <!-- 底部操作按鈕 -->
        <footer class="controls">
            <button type="button" class="action-btn" id="toggleBtn">開始呼吸</button>
        </footer>
    </main>

    <script>
        (function () {
            const app = document.getElementById('app');
            const toggleBtn = document.getElementById('toggleBtn');
            const statusText = document.getElementById('statusText');

            let isRunning = false;
            let phaseTimer = null;

            const INHALE_MS = 4000; // 4 秒吸氣
            const EXHALE_MS = 4000; // 4 秒呼氣

            // 切換文字並附帶微幅淡入淡出效果
            function setStatusText(text) {
                statusText.style.opacity = '0.2';
                setTimeout(() => {
                    statusText.textContent = text;
                    statusText.style.opacity = '1';
                }, 150);
            }

            // 執行單次 4秒吸氣 -> 4秒呼氣 的遞迴排程，確保與 CSS 8秒動畫精準同步
            function runBreathingCycle() {
                if (!isRunning) return;

                // 階段一：0s ~ 4s 吸氣
                setStatusText('吸氣...');

                phaseTimer = setTimeout(() => {
                    if (!isRunning) return;

                    // 階段二：4s ~ 8s 呼氣
                    setStatusText('呼氣...');

                    phaseTimer = setTimeout(() => {
                        if (!isRunning) return;
                        runBreathingCycle(); // 進入下一個 8 秒循環
                    }, EXHALE_MS);

                }, INHALE_MS);
            }

            // 開始呼吸
            function startBreathing() {
                isRunning = true;
                app.classList.add('is-breathing');
                toggleBtn.textContent = '暫停重置';
                toggleBtn.classList.add('active');

                // 觸發微幅手機震動回饋（若裝置支援）
                if (navigator.vibrate) {
                    navigator.vibrate(15);
                }

                runBreathingCycle();
            }

            // 暫停並重置回初始大小
            function stopBreathing() {
                isRunning = false;
                clearTimeout(phaseTimer);
                app.classList.remove('is-breathing');
                toggleBtn.textContent = '開始呼吸';
                toggleBtn.classList.remove('active');
                setStatusText('準備');

                if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            }

            // 綁定點擊事件
            toggleBtn.addEventListener('click', () => {
                if (isRunning) {
                    stopBreathing();
                } else {
                    startBreathing();
                }
            });

            // 當使用者切換手機 App 或鎖定螢幕時自動重置，避免背景計時器與動畫不同步
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isRunning) {
                    stopBreathing();
                }
            });
        })();
    </script>
</body>
</html>
